name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.0"
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - name: Lint with Ruff
        run: uv run ruff check .
      - name: Run unit tests
        run: uv run pytest tests/unit --cov=react_agent --cov-report=term-missing

  backend-integration:
    runs-on: ubuntu-latest
    needs: backend-unit
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.0"
          python-version: "3.12"
      - run: uv sync --locked
      - name: Lint with Ruff
        run: uv run ruff check .
      - name: Build sandbox image
        run: docker build -t react-agent-sandbox:latest ./docker/sandbox

      - name: Run integration tests
        run: uv run pytest tests/integration -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/react_agent/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/react_agent/frontend/package-lock.json
          
      - name: Install dependencies
        run: npm ci

      - name: Check formatting with Prettier
        run: npm run format:check

      - name: Lint frontend
        run: npm run lint
      
      - name: Build frontend
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs:
      - backend-unit
      - backend-integration
      - frontend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend/Dockerfile
          push: false

      - name: Build my-default
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/my-default/Dockerfile
          push: false

      - name: Build sandbox
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/sandbox/Dockerfile
          push: false

      - name: Build frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend/Dockerfile
          push: false

  publish:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - image: backend
            file: docker/backend/Dockerfile

          - image: my-default
            file: docker/my-default/Dockerfile

          - image: sandbox
            file: docker/sandbox/Dockerfile

          - image: frontend
            file: docker/frontend/Dockerfile

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/megasear/workflow-automation-agent-${{ matrix.image }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
description: Red team
targets:
  - id: https
    label: WorkflowAgent
    config:
      url: http://localhost:8000/api/chat
      method: POST
      headers:
        Content-Type: application/json
        Authorization: Bearer {{env.REACT_AGENT_JWT}}
      body:
        message: '{{prompt}}'
redteam:
  numTests: 3
  plugins:
    - id: excessive-agency
      numTests: 3
    - id: harmful:cybercrime
      numTests: 3
    - id: hijacking
      numTests: 3
    - id: pii:api-db
      numTests: 3
    - id: pii:direct
      numTests: 3
    - id: pii:session
      numTests: 3
  strategies:
    - id: basic
  purpose: An AI system
  entities: &ref_0 []
defaultTest:
  metadata:
    purpose: An AI system
    entities: *ref_0
